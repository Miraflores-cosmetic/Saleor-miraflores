# Postgres only — API/Admin/Front на хосте (Node + nginx).
# Путь на VPS: /opt/miraflores/deploy/docker-compose.yml

services:
  db:
    image: postgres:16-alpine
    container_name: miraflores_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-miraflores}
      POSTGRES_USER: ${POSTGRES_USER:-miraflores}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - miraflores_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Опционально: shared ACL cache для нескольких API-инстансов (REDIS_URL в backend/.env).
  redis:
    image: redis:7-alpine
    container_name: miraflores_redis
    restart: unless-stopped
    profiles: ["redis"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  miraflores_pg:
