# Системная конфигурация Nginx для Saleor
# Установите этот файл как: /etc/nginx/sites-available/saleor
# Затем создайте симлинк: ln -s /etc/nginx/sites-available/saleor /etc/nginx/sites-enabled/

upstream saleor_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream saleor_dashboard {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Node: Front/server/cdek-proxy.mjs — СДЭК + Яндекс Доставка (порт 3001).
upstream miraflores_cdek_proxy {
    server 127.0.0.1:3001;
    keepalive 8;
}

# Node: Front/server/yookassa-api.mjs (порт 3002).
upstream miraflores_yookassa_proxy {
    server 127.0.0.1:3002;
    keepalive 8;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=graphql_limit:10m rate=30r/s;

# HTTP -> HTTPS редирект
server {
    listen 80;
    listen [::]:80;
    server_name miraflores-shop.com www.miraflores-shop.com;

    # Редирект всего трафика на HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name miraflores-shop.com www.miraflores-shop.com;

    client_max_body_size 100M;

    # SSL сертификаты (замените на пути к вашим сертификатам от reg.ru)
    ssl_certificate /etc/nginx/ssl/miraflores-shop.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/miraflores-shop.com/privkey.pem;

    # SSL параметры (рекомендованные настройки)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Логи
    access_log /var/log/nginx/saleor_access.log;
    error_log /var/log/nginx/saleor_error.log;

    # GraphQL API endpoint
    location /graphql/ {
        limit_req zone=graphql_limit burst=20 nodelay;

        proxy_pass http://saleor_api/graphql/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # REST API endpoints - Auth
    location /auth/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://saleor_api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # Handle OPTIONS requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # REST API endpoints - Voucher validation
    location /voucher/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://saleor_api/voucher/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # Handle OPTIONS requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # REST API endpoints - Checkout
    location /api/checkout/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://saleor_api/api/checkout/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # Handle OPTIONS requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # REST API endpoints - Steps
    location /api/steps/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://saleor_api/api/steps/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # Handle OPTIONS requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # REST API endpoints - Favorites
    location /api/favorites/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://saleor_api/api/favorites/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # Handle OPTIONS requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # REST API endpoints - Checkout (alternative path without /api/)
    location /checkout/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://saleor_api/checkout/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # Handle OPTIONS requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static files (от Django API)
    # ВАЖНО: Укажите правильный путь к docker volume
    # Найдите путь через: docker volume inspect saleor-miraflores_static_files
    location /static/ {
        alias /var/lib/docker/volumes/saleor-miraflores_static_files/_data/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media files (загруженные файлы)
    # ВАРИАНТ 1: Обслуживание из Docker volume (оптимально для production)
    # Раскомментируйте, если volume настроен правильно:
    # location /media/ {
    #     alias /var/lib/docker/volumes/saleor-miraflores_media_files/_data/;
    #     expires 7d;
    #     add_header Cache-Control "public";
    #     access_log off;
    #     autoindex off;
    #     client_max_body_size 100M;
    # }
    
    # ВАРИАНТ 2: Проксирование через Django API (работает всегда)
    # Используйте этот вариант, если volume не настроен или файлы не найдены
    location /media/ {
        proxy_pass http://127.0.0.1:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Для больших файлов
        client_max_body_size 100M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        
        # Кэширование
        expires 7d;
        add_header Cache-Control "public";
    }

    # Dashboard (React приложение)
    location /dashboard/ {
        proxy_pass http://saleor_dashboard/dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Для React Router
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Health check endpoint
    location /health/ {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://saleor_api/health/;
        proxy_set_header Host $host;
        access_log off;
    }

    # ——— Node-прокси витрины (PM2 / node server/*.mjs) — см. Front/ecosystem.config.js ———
    # Без этих блоков POST на /api/yandex-delivery попадает в location / → статика → 405.

    location /api/cdek {
        proxy_pass http://miraflores_cdek_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        client_max_body_size 100M;
    }

    location /api/yandex {
        proxy_pass http://miraflores_cdek_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        client_max_body_size 100M;
    }

    location /api/yandex-delivery {
        proxy_pass http://miraflores_cdek_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        client_max_body_size 100M;
    }

    # Как в Vite rewrite: фронт бьёт в /api/yookassa/create-payment → бэкенд на 3002 видит /create-payment
    location /api/yookassa/ {
        rewrite ^/api/yookassa/(.*)$ /$1 break;
        proxy_pass http://miraflores_yookassa_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        client_max_body_size 100M;
    }

    # Запретить доступ к скрытым файлам
    location ~ /\.git {
        deny all;
        access_log off;
    }

    location ~ /\.env {
        deny all;
        access_log off;
    }

    location ~ /\.ht {
        deny all;
        access_log off;
    }

    # Frontend (miraflore) - корневой путь (должен быть последним)
    location / {
        root /var/www/miraflores/dist;
        try_files $uri $uri/ /index.html;
        index index.html;
        
        # Кэширование для статических файлов
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
